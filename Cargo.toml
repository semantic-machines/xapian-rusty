[package]
name = "xapian-rusty"
version = "0.0.56"
edition = "2024"
description = "Rust bindings to Xapian"
readme = "README.md"
authors = ["Valeriy Bushenev <ValeriyBushenev@gmail.com>", "David Tolnay <dtolnay@gmail.com>"]
license = "MIT"
links = "xapian-rusty"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trybuild)'] }

[lib]
path = "src/lib.rs"

[dependencies]
cxx = "=1.0.160"

[build-dependencies]
cxx-build = "=1.0.160"
